# Pages CMS (https://pagescms.org) içerik paneli ayarı.
# Marka sahibi bu panelden projeleri ve site bilgilerini düzenler; her kayıt GitHub'a işlenir ve site otomatik yayınlanır.
# Kılavuz: docs/CMS_GUIDE.md · İçerik modeli: docs/CONTENT_MODEL.md

media:
  - name: projeler
    label: Proje görselleri
    input: src/assets/projects
    output: "@assets/projects"
    extensions: [jpg, jpeg, png, webp]

content:
  - name: projeler
    label: Projeler
    type: collection
    path: src/content/projects
    format: yaml
    filename:
      template: "yeni-proje-{year}{month}{day}.yaml"
      field: create
    fields:
      - name: name
        label: Proje adı
        type: object
        fields:
          - { name: tr, label: Türkçe (zorunlu), type: string, required: true }
          - { name: en, label: İngilizce (boşsa Türkçesi kullanılır), type: string }
      - name: type
        label: Proje türü
        type: select
        required: true
        options:
          values:
            - { name: konut, label: Konut }
            - { name: mustakil-ev, label: Müstakil Ev }
            - { name: ticari, label: Ticari }
      - name: gallery
        label: Görseller (ilk görsel kapak olur)
        type: object
        list: true
        fields:
          - name: image
            label: Görsel
            type: image
            required: true
            options:
              media: projeler
              extensions: [jpg, jpeg, png, webp]
          - name: alt
            label: Görselde ne görünüyor? (boşsa otomatik)
            type: object
            fields:
              - { name: tr, label: Türkçe, type: string }
              - { name: en, label: İngilizce, type: string }
      - name: summary
        label: Kısa açıklama
        type: object
        fields:
          - { name: tr, label: Türkçe, type: text }
          - { name: en, label: İngilizce, type: text }
      - name: scope
        label: Kapsam (ör. Mimari proje, iç mekân tasarımı)
        type: object
        fields:
          - { name: tr, label: Türkçe, type: string }
          - { name: en, label: İngilizce, type: string }
      - name: location
        label: Konum
        type: object
        fields:
          - { name: tr, label: Türkçe, type: string }
          - { name: en, label: İngilizce, type: string }
      - { name: year, label: Yıl, type: number }
      - { name: area, label: Alan (m²), type: number }
      - name: status
        label: Durum
        type: select
        options:
          values:
            - { name: konsept, label: Konsept }
            - { name: proje, label: Proje aşamasında }
            - { name: ruhsat, label: Ruhsat aşamasında }
            - { name: insaat, label: İnşaat aşamasında }
            - { name: tamamlandi, label: Tamamlandı }
      - name: imageType
        label: Görsel türü
        type: select
        default: render
        options:
          values:
            - { name: render, label: Render }
            - { name: fotograf, label: Fotoğraf }
      - { name: featured, label: Ana sayfa slaytında göster, type: boolean }
      - { name: featuredOrder, label: Slayttaki sırası (1 = ilk), type: number }
      - { name: order, label: Projeler listesindeki sırası (küçük önce), type: number }
      - name: toVerify
        label: Henüz doğrulanmamış bilgiler (doğruysa işareti kaldırın)
        type: select
        options:
          multiple: true
          values:
            - { name: type, label: Proje türü }

  - name: site
    label: Site bilgileri (iletişim, hakkımızda)
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: brand, label: Marka adı, type: string }
      - { name: phone, label: Telefon (ör. +90 545 871 88 79), type: string }
      - { name: whatsapp, label: WhatsApp (yalnızca rakam, ör. 905458718879), type: string }
      - name: whatsappMessage
        label: WhatsApp hazır mesajı
        type: object
        fields:
          - { name: tr, label: Türkçe, type: string }
          - { name: en, label: İngilizce, type: string }
      - { name: email, label: E-posta, type: string }
      - name: address
        label: Adres
        type: object
        fields:
          - { name: tr, label: Türkçe, type: string }
          - { name: en, label: İngilizce, type: string }
      - { name: mapsUrl, label: Adres bağlantısı (Google Haritalar), type: string }
      - { name: instagram, label: Instagram adresi, type: string }
      - name: about
        label: Hakkımızda metni (paragrafları boş satırla ayırın; son paragraf vurgulu görünür)
        type: object
        fields:
          - { name: tr, label: Türkçe, type: text }
          - { name: en, label: İngilizce, type: text }
      - name: stats
        label: Hakkımızda bilgi kutuları
        type: object
        list: true
        fields:
          - { name: value, label: Sayı (ör. 2008), type: number }
          - { name: suffix, label: Sayıdan sonra (ör. +), type: string }
          - name: text
            label: Sayı yerine yazı (ör. Tasarım & Takip)
            type: object
            fields:
              - { name: tr, label: Türkçe, type: string }
              - { name: en, label: İngilizce, type: string }
          - name: label
            label: Alt yazı
            type: object
            fields:
              - { name: tr, label: Türkçe, type: string }
              - { name: en, label: İngilizce, type: string }
      - name: founders
        label: Kurucular (isteğe bağlı)
        type: object
        list: true
        fields:
          - { name: name, label: Ad soyad, type: string }
          - name: title
            label: Unvan
            type: object
            fields:
              - { name: tr, label: Türkçe, type: string }
              - { name: en, label: İngilizce, type: string }
      - { name: domain, label: "Alan adı (teknik — ör. https://sergahmimarlik.com; dolunca site arama motorlarına açılır)", type: string }
      - { name: previewUrl, label: Geçici yayın adresi (teknik), type: string }
